<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diffusion Quest</title>
<style>
  :root {
    --bg: #11131a; --panel: #1b1f2a; --line: #2c3240;
    --text: #e9ecf3; --muted: #9aa3b5; --accent: #6aa9ff;
    --ok: #3ddc84; --ng: #ff6b6b; --dim: #4a5262;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 17px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .screen { display: none; }
  .screen.on { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .slot-label { font-size: 30px; font-weight: 700; letter-spacing: .04em; }
  .hint-text { color: var(--muted); font-size: 13px; margin-top: 4px; }
  input[type=text] {
    width: 100%; font-size: 20px; padding: 12px; margin-top: 10px;
    background: #0d0f15; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    font: inherit; color: var(--text); background: #262d3b;
    border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  }
  button:disabled { opacity: .5; }
  .primary { background: var(--accent); color: #0b1016; border: none;
             font-weight: 700; width: 100%; font-size: 17px; margin-top: 10px; }
  .timer { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .timer > i { display: block; height: 100%; background: var(--accent); width: 100%; }
  /* 早押しなので、画像・選択肢・送信ボタンを1画面に収める(スクロールさせない) */
  #frame { width: 100%; max-height: 34vh; aspect-ratio: 1/1; border-radius: 12px;
           background: #000; object-fit: cover; display: block; margin-inline: auto; }
  #answer .panel { padding: 8px 10px; margin-bottom: 8px; }
  #answer .primary { position: sticky; bottom: 0; margin-top: 4px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  /* 位置は10秒間固定する。消える選択肢は詰めずにグレーアウトする(RULES.md §4.6) */
  .choices button { min-height: 48px; font-size: 15px; line-height: 1.2;
                    padding: 8px; transition: opacity .2s; }
  .choices button.picked { background: var(--accent); color: #0b1016; font-weight: 700; }
  .choices button.dimmed { opacity: .28; text-decoration: line-through; color: var(--dim); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  /* 「だれが・なにを・どうした」のテロップ。自分の担当がひと目で分かるようにする */
  .telop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .telop div { background: var(--panel); border: 1px solid var(--line);
               border-radius: 10px; padding: 6px 8px; text-align: center; }
  .telop .mine { border-color: var(--accent); background: #1d2838; }
  .telop b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .telop span { font-size: 15px; font-weight: 700; }
  .telop .mine span { color: var(--accent); }
  .telop .unknown span { color: var(--dim); }
  .restart { background: transparent; border: 1px solid var(--line);
             color: var(--muted); width: 100%; margin-top: 10px; }
  .big { font-size: 22px; font-weight: 700; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  .muted { color: var(--muted); font-size: 13px; }
  ul { padding-left: 1.1em; margin: 6px 0; }
</style>
</head>
<body>
<h1 id="status">接続中…</h1>

<div id="lobby" class="screen on">
  <div class="panel">
    <div class="muted">参加者</div>
    <ul id="players"></ul>
    <div class="muted">3人そろうと始まります。</div>
  </div>
</div>

<div id="input" class="screen">
  <div class="panel">
    <div class="slot-label" id="slotLabel">だれが</div>
    <div class="hint-text">1語だけ入力してください</div>
    <input type="text" id="word" autocomplete="off" autocapitalize="off" enterkeyhint="send">
    <div class="hint-text ng" id="drawWarn" hidden></div>
    <button class="primary" id="sendWord">決定</button>
    <div class="timer" style="margin-top:10px"><i id="inputBar"></i></div>
  </div>
</div>

<div id="prepare" class="screen">
  <div class="panel"><div class="big">絵を描いています…</div>
    <div class="muted">3人の語を1つの文にして描きます</div></div>
</div>

<div id="answer" class="screen">
  <div class="telop" id="telopAnswer"></div>
  <img id="frame" alt="">
  <div class="timer" style="margin:8px 0"><i id="answerBar"></i></div>
  <div id="slots"></div>
  <button class="primary" id="submit" disabled>送信</button>
  <div class="muted" id="answerNote"></div>
</div>

<div id="result" class="screen">
  <div class="telop" id="telopResult"></div>
  <div class="panel">
    <div class="big" id="resultTitle"></div>
    <div id="resultWords" style="margin-top:8px"></div>
    <div class="muted" id="resultPoints" style="margin-top:8px"></div>
  </div>
  <button class="restart" id="restart">最初からやり直す</button>
</div>

<script>
// サーバー時刻とのズレ。回答開始の時刻はサーバーが配り、各端末が自分で合わせる
// (RULES.md §8。サーバーから「今切り替えろ」と都度送ると、通信の遅い人だけ不利になる)。
let clockOffset = 0;
const localNow = () => performance.now() / 1000;
const toLocal = (serverTime) => serverTime - clockOffset;

const params = new URLSearchParams(location.search);
const room = params.get("room") || "testroom";
const name = params.get("name") || prompt("名前を入れてください") || "player";
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/${room}/${encodeURIComponent(name)}`);

const $ = (id) => document.getElementById(id);
const show = (id) => document.querySelectorAll(".screen")
  .forEach(s => s.classList.toggle("on", s.id === id));

let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const at = (localTime, fn) => timers.push(setTimeout(fn, Math.max(0, (localTime - localNow()) * 1000)));

function runBar(bar, startLocal, seconds) {
  const tick = () => {
    const left = Math.max(0, startLocal + seconds - localNow());
    bar.style.width = (left / seconds * 100) + "%";
    if (left > 0) requestAnimationFrame(tick);
  };
  tick();
}

// 入力時の警告(RULES.md §3.1【確定】: 警告は出すが入力は弾かない)。
// 【現行案】ここはごく粗い当て推量。本来は語のプールや辞書で判断したい。
function warnIfHardToDraw(word) {
  const warn = $("drawWarn");
  const longKatakana = /^[ァ-ヶー]{7,}$/.test(word);
  const tooLong = [...word].length >= 10;
  const abstract = /(的|性|感|主義|概念|思想)$/.test(word);
  const bad = longKatakana || tooLong || abstract;
  warn.hidden = !bad;
  warn.textContent = bad ? "この語は絵にしにくいかもしれません" : "";
}

$("word").addEventListener("input", (e) => warnIfHardToDraw(e.target.value.trim()));

function sendWord() {
  const w = $("word").value.trim();
  if (!w) return;
  ws.send(JSON.stringify({ type: "input", word: w }));
  $("sendWord").disabled = true;
  $("word").disabled = true;
  $("status").textContent = "他の人を待っています…";
}
$("sendWord").addEventListener("click", sendWord);
$("word").addEventListener("keydown", (e) => { if (e.key === "Enter") sendWord(); });

let picks = {};
let locked = false;
// 自分の担当スロットと、自分が入れた語。テロップに出す
let mySlot = null, myWord = null;
const SLOT_ORDER = ["subject", "object", "predicate"];
const SLOT_NAMES = { subject: "だれが", object: "なにを", predicate: "どうした" };

/** 「だれが・なにを・どうした」を常に出す。自分の担当は色を変えて語も見せる。 */
function renderTelop(el, words) {
  el.innerHTML = SLOT_ORDER.map(slot => {
    const known = words ? words[slot] : (slot === mySlot ? myWord : null);
    const mine = slot === mySlot;
    const cls = mine ? "mine" : (known ? "" : "unknown");
    const label = SLOT_NAMES[slot] + (mine ? "(自分)" : "");
    return `<div class="${cls}"><b>${label}</b><span>${known || "?"}</span></div>`;
  }).join("");
}

function buildChoices(msg) {
  picks = {}; locked = false;
  const host = $("slots");
  host.innerHTML = "";
  const labels = { subject: "だれが", object: "なにを", predicate: "どうした" };
  for (const slot of msg.answer_slots) {
    const box = document.createElement("div");
    box.className = "panel";
    box.innerHTML = `<div class="muted">${labels[slot]}</div>`;
    const grid = document.createElement("div");
    grid.className = "choices";
    // 位置は固定。以後この並びを変えない(動くとタップが遅れる)
    for (const opt of msg.choices[slot]) {
      const b = document.createElement("button");
      b.textContent = opt.ja;
      b.dataset.slot = slot; b.dataset.ja = opt.ja;
      b.addEventListener("click", () => {
        if (locked || b.classList.contains("dimmed")) return;
        grid.querySelectorAll("button").forEach(x => x.classList.remove("picked"));
        b.classList.add("picked");
        picks[slot] = opt.ja;
        $("submit").disabled = Object.keys(picks).length < msg.answer_slots.length;
      });
      grid.appendChild(b);
    }
    box.appendChild(grid);
    host.appendChild(box);
  }
  $("submit").disabled = true;
}

$("submit").addEventListener("click", () => {
  if (locked) return;
  locked = true;
  $("submit").disabled = true;
  ws.send(JSON.stringify({ type: "answer", picks }));
  $("answerNote").textContent = "送信しました";
});

ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.server_now !== undefined) clockOffset = m.server_now - localNow();

  switch (m.type) {
    case "lobby":
      $("players").innerHTML = m.players.map(p => `<li>${p}</li>`).join("");
      $("status").textContent = `ロビー(${m.players.length}/3)`;
      show("lobby");
      break;

    case "restarted":
      $("status").textContent = "最初からやり直します";
      picks = {}; locked = false; mySlot = null; myWord = null;
      break;

    case "round_start":
      $("status").textContent = `ラウンド ${m.round} / ${m.of}`;
      break;

    case "input_start": {
      clearTimers();
      mySlot = m.slot; myWord = null;
      $("slotLabel").textContent = m.slot_label;
      renderTelop($("telopAnswer"), null);
      $("word").value = ""; $("word").disabled = false;
      $("sendWord").disabled = false;
      $("drawWarn").hidden = true;
      $("status").textContent = `第${m.turn + 1}問`;
      show("input");
      $("word").focus();
      runBar($("inputBar"), localNow(), m.seconds);
      break;
    }

    case "input_accepted":
      myWord = m.word;
      $("status").textContent = "他の人を待っています…";
      break;

    case "input_rejected":
      $("sendWord").disabled = false; $("word").disabled = false;
      $("drawWarn").hidden = false;
      $("drawWarn").textContent = m.reason;
      break;

    case "preparing":
      show("prepare");
      break;

    case "sit_out":
      $("resultTitle").textContent = "このターンは見学です";
      $("resultWords").textContent = m.reason;
      $("resultPoints").textContent = "";
      show("result");
      break;

    case "answer_ready": {
      clearTimers();
      buildChoices(m);
      $("answerNote").textContent = "";
      // フレームは**回答開始前に全部読み込む**(回答中に読み込ませない。RULES.md §8)
      const frames = m.frames.map(b64 => {
        const img = new Image();
        img.src = "data:image/jpeg;base64," + b64;
        return img;
      });
      renderTelop($("telopAnswer"), null);
      const start = toLocal(m.answer_start_at);
      at(start, () => {
        show("answer");
        $("status").textContent = "早押し! 自分以外の2語を当てる";
        runBar($("answerBar"), start, m.answer_seconds);
      });
      m.frame_times.forEach((t, i) => at(start + t, () => {
        $("frame").src = frames[i].src;
      }));
      // ヒント: 中くらいのダミーを1つ伏せる。位置は詰めずにグレーアウトする
      at(start + m.hint_at, () => {
        for (const [slot, words] of Object.entries(m.hint_hide || {})) {
          for (const w of words) {
            document.querySelectorAll(`button[data-slot="${slot}"]`).forEach(b => {
              if (b.dataset.ja === w && !b.classList.contains("picked")) {
                b.classList.add("dimmed");
              }
            });
          }
        }
      });
      break;
    }

    case "answer_result":
      locked = true;
      $("answerNote").textContent = m.correct
        ? (m.scored ? "正解! 1点" : "正解でしたが、先に答えた人がいます")
        : "不正解。このターンはここまでです";
      $("answerNote").className = m.correct ? "ok" : "ng";
      break;

    case "answer_rejected":
      $("answerNote").textContent = m.reason;
      break;

    case "substituted":
      $("status").textContent = m.deducted
        ? `語が差し替えられました(${m.count}回目・減点)`
        : `語が差し替えられました(${m.count}回目)`;
      break;

    case "turn_void":
      renderTelop($("telopResult"), null);
      $("resultTitle").textContent = "このターンは無効です";
      $("resultWords").textContent = m.reason;
      $("resultPoints").textContent = "やり直します";
      show("result");
      break;

    case "turn_result": {
      clearTimers();
      const w = m.words;
      $("resultTitle").textContent = m.winner ? `${m.winner} が正解!` : "正解者なし";
      $("resultTitle").className = "big " + (m.winner === name ? "ok" : "");
      // 助詞はサーバー側(LLM)が組み立てる。ここで「を」を貼ると
      // 「バナナでを切腹する」のように壊れる
      const sentence = m.sentence_ja ||
        `${w.subject} ${w.object} ${w.predicate}`;
      $("resultWords").innerHTML =
        `<div class="big">${sentence}</div>` +
        `<div class="muted">${m.prompt_en}</div>`;
      renderTelop($("telopResult"), w);
      $("resultPoints").textContent =
        Object.entries(m.points).map(([p, v]) => `${p}: ${v}点`).join(" / ");
      show("result");
      break;
    }

    case "round_end":
      $("resultTitle").textContent = m.winner
        ? `ラウンド${m.round} は ${m.winner} の勝ち` : `ラウンド${m.round} は引き分け`;
      $("resultWords").textContent = "";
      $("resultPoints").textContent =
        Object.entries(m.round_wins).map(([p, v]) => `${p}: ${v}勝`).join(" / ");
      show("result");
      break;

    case "game_end":
      $("status").textContent = "ゲーム終了";
      $("resultTitle").textContent = `優勝: ${m.winners.join(" と ")}`;
      $("resultWords").innerHTML = Object.entries(m.round_wins)
        .map(([p, v]) => `<div>${p}: ${v}勝 / 合計${m.total_points[p]}点</div>`).join("");
      $("resultPoints").textContent = "";
      show("result");
      break;
  }
};

$("restart").addEventListener("click", () => {
  if (!confirm("最初からやり直しますか?(得点はすべて消えます)")) return;
  ws.send(JSON.stringify({ type: "restart" }));
});

ws.onclose = () => { $("status").textContent = "接続が切れました"; };
ws.onerror = () => { $("status").textContent = "接続エラー"; };
</script>
</body>
</html>
